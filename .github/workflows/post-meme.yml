name: Reddit to Telegram Media Bot

on:
  schedule:
    - cron: "0 */2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify installation
        run: |
          python --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u post_meme.py

      - name: Save history
        if: success()
        run: |

          echo "========================================"
          echo "SAVING POST HISTORY"
          echo "========================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f posted.json ]; then
            echo "Creating posted.json..."

            cat > posted.json <<'EOF'
          {
            "urls": [],
            "ids": [],
            "hashes": [],
            "next_type": 0
          }
          EOF
          fi

          git add posted.json

          if git diff --cached --quiet; then
            echo "No history changes."
            exit 0
          fi

          git commit -m "Update Telegram posting history"

          git fetch origin main

          if ! git rebase origin/main; then

            echo "Rebase conflict detected."

            if git ls-files -u | grep -q "posted.json"; then

              echo "Resolving posted.json conflict..."

              git checkout --theirs posted.json
              git add posted.json

              GIT_EDITOR=true git rebase --continue

            else

              echo "Unable to resolve conflict."

              git rebase --abort

              exit 1

            fi

          fi

          git push origin HEAD:main

          echo "History saved successfully."
