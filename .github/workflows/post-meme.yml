name: Reddit to Telegram Media Bot

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  post:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      - name: Verify FFmpeg
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1


      - name: Run Reddit Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python -u post_meme.py


      - name: Save posting history
        if: success()
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add posted.json

          if git diff --cached --quiet; then
            echo "No history changes."
            exit 0
          fi

          git commit -m "Update posting history"

          git fetch origin main

          git rebase origin/main || true

          if git ls-files -u | grep -q .; then

            echo "Resolving posted.json conflict..."

            git checkout --theirs posted.json

            git add posted.json

            GIT_EDITOR=true git rebase --continue || true

          fi

          git push origin HEAD:main
