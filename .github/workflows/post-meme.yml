name: Reddit to Telegram Media Bot

on:
  schedule:
    - cron: "0 */2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main


      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ------------------------------------------------------
      # FFMPEG
      # ------------------------------------------------------

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ------------------------------------------------------
      # VERIFY
      # ------------------------------------------------------

      - name: Verify installation
        run: |
          python --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1


      # ------------------------------------------------------
      # RUN BOT
      # ------------------------------------------------------

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python -u post_meme.py


      # ------------------------------------------------------
      # SAVE HISTORY
      # ------------------------------------------------------

      - name: Save history
        if: success()

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add posted.json posting_state.json

          if git diff --cached --quiet; then
            echo "No history changes."
            exit 0
          fi

          git commit \
            -m "Update Telegram posting history"

          git fetch origin main

          if ! git rebase origin/main; then

            echo "Rebase conflict detected."

            git status --short

            if git ls-files -u | grep -q .; then

              echo "Resolving history files..."

              git checkout --theirs -- \
                posted.json \
                posting_state.json

              git add \
                posted.json \
                posting_state.json

              GIT_EDITOR=true \
                git rebase --continue

            else

              exit 1

            fi

          fi

          git push origin HEAD:main